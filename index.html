<!doctype html>
<html>
<head>
  <style>
    html, body {
      margin: 0; height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    #cat { width: 180px; display: block; margin: 0 auto; overflow: visible; }

    #all  { transform-origin: 100px 248px; animation: breathe 3s ease-in-out infinite; }
    #tail { transform-origin: 96px 246px;  animation: sway 2.4s ease-in-out infinite; }
    #eyes { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }

    @keyframes breathe { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.02,.98); } }
    @keyframes sway    { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
    @keyframes blink   { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
  </style>
</head>
